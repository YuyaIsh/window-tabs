name: Release Windows

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release-gate.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether this main push needs a release
        id: release-gate
        shell: bash
        run: |
          decision="$(node scripts/check-version-bump.mjs --main-push --base "${{ github.event.before }}")"
          echo "should_release=$decision" >> "$GITHUB_OUTPUT"
          if [ "$decision" = "true" ]; then
            echo "release-impacting changes or a newer application version require a release."
          else
            echo "no release-impacting changes and no application version bump; skipping release."
          fi

  release:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run check:secrets
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Inject and validate updater signing configuration
        run: pnpm run check:release
        env:
          REQUIRE_RELEASE_KEY: "1"
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Read release version
        id: release-version
        shell: pwsh
        run: |
          $version = node --input-type=module -e "import fs from 'node:fs'; process.stdout.write(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Atomically reserve release tag and Release
        id: reserve-release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `v${process.env.RELEASE_VERSION}`;
            const releaseName = `window-tabs ${process.env.RELEASE_VERSION}`;
            const releaseBody = 'Install with the x64 NSIS setup.exe. Updater metadata and signatures are attached.\n\n<!-- window-tabs automated release -->';
            const { expectedReleaseAssets } = require(`${process.env.GITHUB_WORKSPACE}/scripts/release-assets.cjs`);
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.info(`Created ${tag} for ${context.sha}.`);
            } catch (error) {
              if (error.status !== 422) throw error;

              const existingRef = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              if (existingRef.data.object.type !== 'commit' || existingRef.data.object.sha !== context.sha) {
                core.setFailed(`${tag} already exists. Bump the application version before releasing.`);
                return;
              }
              core.warning(`${tag} already points to this commit; checking whether its Release was created by an incomplete attempt.`);
            }

            try {
              const release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: true,
                prerelease: false,
              });
              core.setOutput('release_id', release.data.id.toString());
              core.setOutput('resume_mode', 'rebuild');
              core.info(`Created Release for ${tag}.`);
            } catch (error) {
              if (error.status !== 422) throw error;

              const existingRelease = (await github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              })).find((release) => release.tag_name === tag);
              if (!existingRelease || existingRelease.name !== releaseName || existingRelease.body !== releaseBody) {
                core.setFailed(`${tag} already exists with a Release. Bump the application version before releasing.`);
                return;
              }

              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existingRelease.id,
                per_page: 100,
              });
              const assetNames = new Set(assets.map((asset) => asset.name || asset.label));
              const expectedAssets = expectedReleaseAssets(process.env.RELEASE_VERSION);
              const hasCompleteAssets = expectedAssets.every((assetName) => assetNames.has(assetName));

              if (existingRelease.draft) {
                core.setOutput('release_id', existingRelease.id.toString());
                core.setOutput('resume_mode', hasCompleteAssets ? 'publish' : 'rebuild');
                core.warning(
                  hasCompleteAssets
                    ? `${tag} has a complete automated draft Release; resuming with publish-only.`
                    : `${tag} has an incomplete automated draft Release; rebuilding and replacing only generated assets.`,
                );
                return;
              }

              if (hasCompleteAssets) {
                core.setOutput('release_id', existingRelease.id.toString());
                core.setOutput('resume_mode', 'published');
                core.warning(`${tag} is already a complete published automated Release; treating the retry as successful.`);
                return;
              }

              core.setFailed(`${tag} already has an incomplete published Release. It will not be modified; bump the application version before releasing.`);
            }
      # action-v1.0.0. Keep the full immutable revision for reviewable releases.
      # With releaseId set, the action uploads to the reserved draft and skips
      # its own release creation; publication remains explicit below.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        if: success() && steps.reserve-release.outputs.resume_mode != 'publish' && steps.reserve-release.outputs.resume_mode != 'published'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.reserve-release.outputs.release_id }}
          tagName: v__VERSION__
          releaseName: window-tabs v__VERSION__
          releaseBody: |
            Install with the x64 NSIS setup.exe. Updater metadata and signatures are attached.

            <!-- window-tabs automated release -->
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis
      - name: Publish release after assets are uploaded
        if: success()
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { expectedReleaseAssets } = require(`${process.env.GITHUB_WORKSPACE}/scripts/release-assets.cjs`);
            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number('${{ steps.reserve-release.outputs.release_id }}'),
            });
            const expectedAssets = expectedReleaseAssets(process.env.RELEASE_VERSION);
            const assetNames = new Set((await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              per_page: 100,
            })).map((asset) => asset.name || asset.label));
            const missingAssets = expectedAssets.filter((assetName) => !assetNames.has(assetName));
            if (missingAssets.length > 0) {
              core.setFailed(`refusing to publish ${release.data.tag_name}; missing assets: ${missingAssets.join(', ')}`);
              return;
            }
            if (!release.data.draft) {
              core.info(`Release ${release.data.tag_name} is already published with all expected assets.`);
              return;
            }
            const { pathToFileURL } = require('node:url');
            const { latestPublishedVersion, shouldPublishAsLatest } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/check-release-version.mjs`).href
            );
            const publishedReleases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            let latestVersion;
            try {
              latestVersion = latestPublishedVersion(publishedReleases);
            } catch (error) {
              core.setFailed(error.message);
              return;
            }
            if (latestVersion && !shouldPublishAsLatest(process.env.RELEASE_VERSION, latestVersion)) {
              core.setFailed(
                `refusing to publish ${release.data.tag_name}; published SemVer ${latestVersion} is not older than ${release.data.tag_name}.`,
              );
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
            core.info('Published the release after the signed assets were uploaded.');
